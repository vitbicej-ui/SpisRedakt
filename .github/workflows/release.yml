name: Release
# Pushing a tag such as v0.9.0 builds the Windows package and publishes it as a
# pre-release. The tag must match VERSION in anonymizer/audit.py.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag matches application version
        shell: pwsh
        run: |
          $version = (Select-String -Path anonymizer/audit.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version." }
      - run: python -m pip install -r requirements-build.txt
      - name: Czech OCR data
        shell: pwsh
        run: ./scripts/get-ocr.ps1
      - name: Regression tests
        shell: pwsh
        run: |
          $env:SPISREDAKT_TEST_TESSDATA = (Resolve-Path tessdata).Path
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "SpisRedakt-$env:GITHUB_REF_NAME-Windows-x64.zip"
          Compress-Archive -Path dist/SpisRedakt/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "SHA-256: $hash`n`nPostup ručního testu je v TESTOVANI.md." | Out-File notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $archive --repo $env:GITHUB_REPOSITORY --prerelease `
            --title "SpisRedakt $env:GITHUB_REF_NAME" --notes-file notes.md
